<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentHub</title>
<!--
  资源路径上带 ?v= 是有意的，别删。

  pywebview 给本地文件用的那个内建 HTTP 服务**没有发 Cache-Control**
  （它设了，但被 bottle.static_file 返回的响应对象顶掉了，只剩 Last-Modified
  和 ETag）。于是 WebView2 走启发式缓存——新鲜期大约是文件年龄的 10%，
  文件越旧缓存窗口越长。改了前端却看到旧界面，就是这么来的。

  改前端的时候顺手把这个版本号加一下（和 pyproject.toml 的 version 对齐）。
-->
<link rel="stylesheet" href="tokens.css?v=0.2.10">
<link rel="stylesheet" href="style.css?v=0.2.10">
</head>
<body>

<!-- ------------------------------------------------------------------ 悬浮球 -->
<template id="tpl-ball">
  <div class="ball" data-level="0" data-pulse="0">
    <div class="ball__pulse"></div>
    <svg class="ball__art" viewBox="0 0 76 76" aria-hidden="true">
      <defs>
        <!-- 毛色：左上受光，右下压暗，一颗球的立体感就够，不用再加高光块
             （水豚的毛是哑光的，打高光反而像塑料）。

             ⚠️ stop 的颜色走 class、由 style.css 给，别改回 stop-color="var(...)"。
             SVG 的 <stop> 不解析 presentation attribute 里的 CSS 变量，渐变会整个
             失效，而失效的表现是**引用它的那个圆直接不画**——脸凭空消失，
             但不报任何错。踩过。 -->
        <radialGradient id="capy-fur" cx="36%" cy="26%" r="80%">
          <stop class="fur-hi"  offset="0%"/>
          <stop class="fur-mid" offset="58%"/>
          <stop class="fur-lo"  offset="100%"/>
        </radialGradient>
        <!-- 只让脸在这个圆里出现；耳朵之类探出去的部分由它裁掉 -->
        <clipPath id="ball-clip"><circle cx="38" cy="38" r="31"/></clipPath>
      </defs>

      <circle class="ball__ring" cx="38" cy="38" r="35.5"/>

      <g clip-path="url(#ball-clip)">
        <!-- 头 -->
        <circle class="capy__head" cx="38" cy="38" r="31"/>

        <!-- 耳朵：往头顶外侧长，内耳留一圈浅色。
             这一圈浅色是让它读成「耳朵」而不是「头顶两个斑点」的关键——
             第一版没内耳、又贴着内侧，看着像两块阴影。 -->
        <g class="capy__ears">
          <circle cx="23" cy="15.5" r="6.6" fill="var(--capy-ear)"/>
          <circle cx="53" cy="15.5" r="6.6" fill="var(--capy-ear)"/>
          <circle cx="23" cy="15.8" r="2.9" fill="var(--capy-muzzle)" opacity=".5"/>
          <circle cx="53" cy="15.8" r="2.9" fill="var(--capy-muzzle)" opacity=".5"/>
        </g>

        <!-- 腮红 -->
        <ellipse cx="23" cy="42" rx="4"   ry="2.6" fill="var(--capy-blush)" opacity=".5"/>
        <ellipse cx="53" cy="42" rx="4"   ry="2.6" fill="var(--capy-blush)" opacity=".5"/>

        <!-- 吻部：水豚的招牌，方正宽大 -->
        <ellipse cx="38" cy="46" rx="12" ry="7.6" fill="var(--capy-muzzle)"/>
        <ellipse cx="34.4" cy="44.4" rx="1.7" ry="1.15" fill="var(--capy-ink)" opacity=".7"/>
        <ellipse cx="41.6" cy="44.4" rx="1.7" ry="1.15" fill="var(--capy-ink)" opacity=".7"/>
        <path d="M34.6 50.4 Q38 52.6 41.4 50.4" fill="none"
              stroke="var(--capy-ink)" stroke-width="1.25"
              stroke-linecap="round" opacity=".55"/>

        <!-- 眼睛 -->
        <g class="capy__eyes">
          <g class="capy__eye">
            <circle cx="28.4" cy="33.4" r="3.15" fill="var(--capy-ink)"/>
            <circle cx="27.4" cy="32.4" r="1.05" fill="#FFFFFF" opacity=".85"/>
          </g>
          <g class="capy__eye">
            <circle cx="47.6" cy="33.4" r="3.15" fill="var(--capy-ink)"/>
            <circle cx="46.6" cy="32.4" r="1.05" fill="#FFFFFF" opacity=".85"/>
          </g>
        </g>
      </g>

      <!-- 四个工具的状态点，横排在水豚下巴底下，当它小爪子边的一串珠子 -->
      <g class="ball__dots"></g>
    </svg>
    <div class="ball__badge" data-show="0" data-tone="warn">0</div>
  </div>
</template>

<!-- ------------------------------------------------------------------ 状态面板 -->
<template id="tpl-panel">
  <div class="panel">
    <header class="panel__head">
      <svg class="panel__mark" viewBox="0 0 24 24" aria-hidden="true">
        <circle class="mark__ear" cx="6.6"  cy="5.2" r="2.6"/>
        <circle class="mark__ear" cx="17.4" cy="5.2" r="2.6"/>
        <circle class="mark__head" cx="12" cy="12.6" r="9.4"/>
        <ellipse class="mark__muzzle" cx="12" cy="15" rx="4.7" ry="2.9"/>
        <ellipse class="mark__nose" cx="10.55" cy="14.4" rx=".72" ry=".5"/>
        <ellipse class="mark__nose" cx="13.45" cy="14.4" rx=".72" ry=".5"/>
        <circle class="mark__eye" cx="8.5"  cy="10.4" r="1.3"/>
        <circle class="mark__eye" cx="15.5" cy="10.4" r="1.3"/>
      </svg>
      <div class="panel__title">AgentHub</div>
      <div class="panel__sub" id="sub"></div>
      <button class="panel__close" id="close" title="收起（Esc 也可以）" aria-label="收起面板">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
          <path d="M1.2 1.2 L8.8 8.8 M8.8 1.2 L1.2 8.8" fill="none"
                stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <div class="cards" id="cards"></div>

    <footer class="panel__foot" id="foot">
      <span class="foot__spark"></span>
      <span id="foot-text">正在读取状态…</span>
    </footer>
  </div>
</template>

<script src="app.js?v=0.2.10"></script>
</body>
</html>
