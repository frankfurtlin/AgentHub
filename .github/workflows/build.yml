name: Build

# 每次往 main 推代码就重新打一次包，发布到固定的 latest release。
#
# 「只留最新的一个包」是怎么做到的：release 的 tag 恒为 `latest`，
# 每次发布前先把旧的 release（连带 tag）删掉，再建一个同名的。
# 于是 release 页面永远只有一份产物，URL 也是固定的：
#     https://github.com/<owner>/<repo>/releases/latest
#
# 想保留历史版本的话，把下面 release job 里的 tag 换成
# `v${{ github.run_number }}` 或 `${{ github.sha }}` 即可。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 连续推送时，新的运行把旧的那个取消掉。
# 这一条不是锦上添花：runner 排队卡住（比如指到了一个已下线的镜像标签）时，
# 旧运行会挂 45 分钟才被服务端丢弃，期间白占着队列。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 脚本的输出、日志、测试断言里都有中文。Windows runner 的默认编码不是 UTF-8，
# 不设这个的话 print 中文会抛 UnicodeEncodeError——报错信息跟编码毫无关系，
# 极难排查（第一次跑就踩了：macOS 全绿，只有 Windows 挂在打包步骤）。
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Intel Mac 那个包是「有最好」，不该拖住发布：
    # 它跑不通（或 runner 排队排到超时）时，其余两个包照常发。
    continue-on-error: ${{ matrix.required == false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: AgentHub-windows-x64
            required: true
          - os: macos-latest
            name: AgentHub-macos-arm64
            required: true
          # ⚠️ 别写 macos-13：GitHub 已经把 macOS 13 的镜像下线了，
          # 用它会一直停在 queued，45 分钟后整个运行被丢弃。
          # 现在 Intel Mac 的标准镜像标签是 macos-15-intel。
          - os: macos-15-intel
            name: AgentHub-macos-x64
            required: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build,dev]"

      - name: 语法检查
        run: python -m compileall -q agenthub tools tests

      # 测试是纯逻辑的（假后端，不碰系统 API），三个平台上都应该稳过。
      # 真挂了就该拦住构建——别让一个有问题的包发出去。
      - name: 跑测试
        run: python -m pytest tests/ -q

      - name: 打包
        run: python tools/build.py --clean --zip

      # 打包出来的 exe 是 --windowed（无控制台），--once 的输出看不到，
      # 所以判断依据是**退出码**：能正常扫完就是 0。日志在下一步打出来。
      - name: 冒烟测试
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./dist/AgentHub/AgentHub.exe --once
          else
            # macOS 后端还是占位实现（agenthub/host/macos/），真跑会抛
            # NotImplementedError。这里只验包结构和二进制可执行，不跑扫描。
            test -x "dist/AgentHub.app/Contents/MacOS/AgentHub"
            echo "macOS 包结构正常（后端未实现，跳过扫描）"
          fi

      - name: 打印诊断日志
        if: always()
        shell: bash
        run: |
          LOG="${APPDATA:-$HOME}/AgentHub/agenthub.log"
          if [ -f "$LOG" ]; then cat "$LOG"; else echo "（没有生成日志）"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: 发布 latest
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 删掉上一次的 latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 第一次发布时 latest 还不存在，gh 会返回非零；
          # run 步骤是 bash -e，不兜住的话这里直接失败。
          gh release delete latest --yes --cleanup-tag || true
          # 极端情况下 --cleanup-tag 没生效（tag 被保护规则挡住之类），
          # 这里再兜一次，否则下一步 create 会因为 tag 已存在而失败。
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/latest" || true

      - name: 发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 三个包全挂时 dist 是空的，这时候不该硬发一个空 release
          if ! ls dist/*.zip >/dev/null 2>&1; then
            echo "没有产物，跳过发布"
            exit 0
          fi
          echo "将发布："
          ls -lh dist/*.zip
          gh release create latest \
            --title "AgentHub 最新构建" \
            --notes "由 \`$GITHUB_REF\` @ \`${GITHUB_SHA::7}\` 自动构建 $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --target "$GITHUB_SHA" \
            dist/*.zip
